<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Magic Duel P2P</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #000; font-family: sans-serif; }
    #ui { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; }
    #hud { position: absolute; bottom: 20px; left: 20px; color: #fff; }
    .bar-bg { width: 200px; height: 16px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 4px; overflow: hidden; }
    #hp-bar { width: 100%; height: 100%; background: #ff4757; transition: width 0.2s; }
    #info { margin-top: 6px; font-size: 14px; text-shadow: 1px 1px 2px #000; }
    
    #overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; z-index: 10;
    }
    #overlay h1 { font-size: 36px; margin-bottom: 10px; color: #70a1ff; }
    #overlay p { margin-bottom: 20px; font-size: 14px; color: #ccc; }
    .btn {
      padding: 10px 24px; font-size: 16px; background: #1e90ff; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .btn:hover { background: #3742fa; }
    #room-input { padding: 10px; font-size: 16px; border-radius: 4px; border: none; margin-bottom: 12px; text-align: center; }
  </style>

  <!-- ライブラリ読み込み（Three.js と PeerJS） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="ui">
    <div id="crosshair">+</div>
    <div id="hud">
      <div class="bar-bg"><div id="hp-bar"></div></div>
      <div id="info">準備中...</div>
    </div>
  </div>

  <div id="overlay">
    <h1>3D MAGIC DUEL</h1>
    <p>【WASD】移動　【マウス】視点移動　【クリック】魔法弾発射</p>
    <input type="text" id="room-input" placeholder="合言葉（ルーム名）を入力" value="battle123">
    <button class="btn" id="start-btn">戦闘開始</button>
  </div>

  <script>
    // --- 3Dグラフィック初期設定 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0c1a, 0.02);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(scene.fog.color);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x555577, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // アリーナと柱
    const arenaRadius = 30;
    const floor = new THREE.Mesh(new THREE.CircleGeometry(arenaRadius, 32), new THREE.MeshStandardMaterial({ color: 0x1e272e }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const pillarGeo = new THREE.CylinderGeometry(1.5, 1.5, 6, 16);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x485460 });
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      const pillar = new THREE.Mesh(pillarGeo, pillarMat);
      pillar.position.set(Math.cos(angle) * 12, 3, Math.sin(angle) * 12);
      scene.add(pillar);
    }

    // 敵プレイヤーモデル
    const enemyMesh = new THREE.Group();
    const enemyBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.6, 16), new THREE.MeshStandardMaterial({ color: 0xff3838 }));
    enemyBody.position.y = 0.8;
    const enemyHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00d2d3 }));
    enemyHead.position.y = 1.7;
    enemyMesh.add(enemyBody, enemyHead);
    enemyMesh.visible = false;
    scene.add(enemyMesh);

    // --- プレイヤー状態 ---
    let myHp = 100;
    const spells = [];
    const spellGeo = new THREE.SphereGeometry(0.25, 8, 8);
    const spellMat = new THREE.MeshBasicMaterial({ color: 0x00d2d3 });

    function resetPosition() {
      const angle = Math.random() * Math.PI * 2;
      camera.position.set(Math.cos(angle) * 15, 1.6, Math.sin(angle) * 15);
      myHp = 100;
      document.getElementById('hp-bar').style.width = '100%';
    }
    resetPosition();

    // --- P2Pオンライン通信（PeerJS） ---
    let peer = null;
    let conn = null;

    function initNetwork(roomId) {
      const hostId = `magic-duel-${roomId}-host`;
      const guestId = `magic-duel-${roomId}-guest`;

      // まずホストとして参加を試みる
      peer = new Peer(hostId);

      peer.on('open', () => {
        document.getElementById('info').innerText = '相手の参加を待っています...';
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // ホストが既にいればゲストとして接続
          peer = new Peer(guestId);
          peer.on('open', () => {
            conn = peer.connect(hostId);
            setupConnection();
          });
        }
      });
    }

    function setupConnection() {
      enemyMesh.visible = true;
      document.getElementById('info').innerText = '対戦相手が接続しました！戦闘開始！';

      conn.on('data', (data) => {
        if (data.type === 'move') {
          enemyMesh.position.set(data.x, 0, data.z);
          enemyMesh.rotation.y = data.rot;
        } else if (data.type === 'shoot') {
          spawnSpell(data.x, data.y, data.z, data.vx, data.vy, data.vz, false);
        } else if (data.type === 'hit') {
          myHp -= 25;
          document.getElementById('hp-bar').style.width = `${Math.max(0, myHp)}%`;
          if (myHp <= 0) {
            document.getElementById('info').innerText = '倒されました！リスポーン中...';
            setTimeout(() => {
              resetPosition();
              document.getElementById('info').innerText = '戦闘中';
            }, 2500);
          }
        }
      });
    }

    // --- 操作・入力 ---
    let isLocked = false;
    let pitch = 0, yaw = 0;
    const keys = {};

    document.getElementById('start-btn').addEventListener('click', () => {
      const room = document.getElementById('room-input').value.trim() || 'default';
      initNetwork(room);
      document.getElementById('overlay').style.display = 'none';
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      if (!isLocked && myHp > 0) {
        document.getElementById('overlay').style.display = 'flex';
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.0025;
      pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY * 0.0025));
    });

    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    let canShoot = true;
    window.addEventListener('mousedown', (e) => {
      if (!isLocked || e.button !== 0 || !canShoot || myHp <= 0) return;
      canShoot = false;
      setTimeout(() => { canShoot = true; }, 350);

      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const spawnX = camera.position.x + dir.x * 0.5;
      const spawnY = camera.position.y + dir.y * 0.5;
      const spawnZ = camera.position.z + dir.z * 0.5;
      const vx = dir.x * 35, vy = dir.y * 35, vz = dir.z * 35;

      spawnSpell(spawnX, spawnY, spawnZ, vx, vy, vz, true);

      if (conn && conn.open) {
        conn.send({ type: 'shoot', x: spawnX, y: spawnY, z: spawnZ, vx, vy, vz });
      }
    });

    function spawnSpell(x, y, z, vx, vy, vz, isMine) {
      const mesh = new THREE.Mesh(spellGeo, spellMat);
      mesh.position.set(x, y, z);
      scene.add(mesh);
      spells.push({ mesh, vx, vy, vz, life: 2.0, isMine });
    }

    // --- メインループ ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isLocked && myHp > 0) {
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        const move = new THREE.Vector3();
        if (keys['KeyW']) move.z -= 1;
        if (keys['KeyS']) move.z += 1;
        if (keys['KeyA']) move.x -= 1;
        if (keys['KeyD']) move.x += 1;
        move.normalize();

        const sin = Math.sin(yaw), cos = Math.cos(yaw);
        camera.position.x += (move.x * cos - move.z * sin) * 10 * delta;
        camera.position.z += (move.x * sin + move.z * cos) * 10 * delta;

        // エリア制限
        const dist = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
        if (dist > arenaRadius - 1) {
          camera.position.x = (camera.position.x / dist) * (arenaRadius - 1);
          camera.position.z = (camera.position.z / dist) * (arenaRadius - 1);
        }

        // 位置同期を相手に送信
        if (conn && conn.open) {
          conn.send({ type: 'move', x: camera.position.x, z: camera.position.z, rot: yaw });
        }
      }

      // 弾の挙動 & 当たり判定
      for (let i = spells.length - 1; i >= 0; i--) {
        const s = spells[i];
        s.life -= delta;
        s.mesh.position.x += s.vx * delta;
        s.mesh.position.y += s.vy * delta;
        s.mesh.position.z += s.vz * delta;

        // 相手の弾が自分に当たったか判定
        if (!s.isMine && myHp > 0) {
          if (camera.position.distanceTo(s.mesh.position) < 1.2) {
            if (conn && conn.open) conn.send({ type: 'hit' });
            scene.remove(s.mesh);
            spells.splice(i, 1);
            continue;
          }
        }

        if (s.life <= 0) {
          scene.remove(s.mesh);
          spells.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
