<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Magic FPS Duel - Ruins Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #05070d; font-family: sans-serif; }
    #ui { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
    
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; border: 2px solid rgba(0, 242, 254, 0.7);
      border-radius: 50%; pointer-events: none;
    }
    #crosshair::after {
      content: ''; position: absolute; top: 4px; left: 4px; width: 2px; height: 2px;
      background: #fff; border-radius: 50%;
    }

    #hud { position: absolute; bottom: 20px; left: 160px; color: #fff; }
    .bar-label { font-size: 11px; font-weight: bold; margin-bottom: 2px; text-shadow: 1px 1px 2px #000; }
    .bar-bg { width: 200px; height: 14px; background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); transition: width 0.15s; }
    #mp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #0984e3, #00cec9); transition: width 0.1s; }
    #info { margin-top: 4px; font-size: 13px; font-weight: bold; color: #55e6c1; text-shadow: 0 0 4px #000; }

    #minimap-container {
      position: absolute; bottom: 20px; left: 20px;
      width: 125px; height: 125px; background: rgba(10, 15, 29, 0.75);
      border: 2px solid #00cec9; border-radius: 6px; overflow: hidden;
    }
    #minimap { width: 100%; height: 100%; }

    #damage-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, transparent 60%, rgba(255, 0, 0, 0.6) 100%);
      opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out;
    }

    #overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 7, 13, 0.88); display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; z-index: 10;
    }
    #overlay h1 { font-size: 40px; margin-bottom: 12px; color: #00d2d3; text-shadow: 0 0 25px #00d2d3; letter-spacing: 3px; }
    #overlay p { margin-bottom: 6px; font-size: 14px; color: #ccc; }
    .controls { margin-bottom: 24px; color: #888; font-size: 12px; line-height: 1.6; text-align: center; }
    .btn {
      padding: 12px 32px; font-size: 18px; background: #10ac84; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      box-shadow: 0 0 15px rgba(16, 172, 132, 0.4);
    }
    .btn:hover { background: #1dd1a1; }
    #room-input { padding: 10px; font-size: 16px; border-radius: 6px; border: 2px solid #10ac84; margin-bottom: 16px; text-align: center; background: #222; color: #fff; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="damage-overlay"></div>

  <div id="ui">
    <div id="crosshair"></div>

    <div id="minimap-container">
      <canvas id="minimap" width="125" height="125"></canvas>
    </div>

    <div id="hud">
      <div class="bar-label">HP</div>
      <div class="bar-bg"><div id="hp-bar"></div></div>
      <div class="bar-label">MP (MANA)</div>
      <div class="bar-bg"><div id="mp-bar"></div></div>
      <div id="info">合言葉を入力して参戦</div>
    </div>
  </div>

  <div id="overlay">
    <h1>RUINS OF MAGIC</h1>
    <p>3D 一人称 魔法決闘アリーナ</p>
    <p class="controls">
      【WASD】移動　【SPACE】ジャンプ　【マウス】照準<br>
      【左クリック短押し】魔法弾（MP 25消費）<br>
      【長押し or 右クリック】ガード展開（正面ダメ75%軽減・MP持続消費）
    </p>
    <input type="text" id="room-input" placeholder="合言葉（ルーム名）" value="arena888">
    <button class="btn" id="start-btn">参戦する</button>
  </div>

  <script>
    // --- 1. シーン & ライティング ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x2d3436, 1.2));
    const moonLight = new THREE.DirectionalLight(0x74b9ff, 1.0);
    moonLight.position.set(30, 60, 20);
    scene.add(moonLight);

    // --- 2. 遺跡ステージ生成 ---
    const colliders = [];
    const mapObstacles = [];

    function addBox(x, y, z, w, h, d, color = 0x2f3640) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.2 })
      );
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const box = new THREE.Box3().setFromObject(mesh);
      colliders.push(box);
      mapObstacles.push({ x, z, w, d });
      return mesh;
    }

    // 床
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), new THREE.MeshStandardMaterial({ color: 0x191e24, roughness: 0.9 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // 外壁 (35m四方)
    addBox(0, 0, -35, 70, 8, 2, 0x1e272e);
    addBox(0, 0, 35, 70, 8, 2, 0x1e272e);
    addBox(-35, 0, 0, 2, 8, 70, 0x1e272e);
    addBox(35, 0, 0, 2, 8, 70, 0x1e272e);

    // 中央テラス（2段構造）
    addBox(0, 0, 0, 14, 2.5, 14, 0x353b48);
    addBox(0, 2.5, 0, 8, 2.5, 8, 0x2f3640);
    addBox(0, 5.0, 0, 2, 4.0, 2, 0x00d2d3);

    // 登り台座ブロック
    addBox(0, 0, 9, 4, 1.25, 4);
    addBox(0, 0, -9, 4, 1.25, 4);
    addBox(9, 0, 0, 4, 1.25, 4);
    addBox(-9, 0, 0, 4, 1.25, 4);

    // 迷路壁
    const mazeWalls = [
      [-16, -16, 12, 2], [-16, 16, 12, 2], [16, -16, 12, 2], [16, 16, 12, 2],
      [-22, 0, 2, 16], [22, 0, 2, 16],
      [-8, -24, 2, 10], [8, -24, 2, 10], [-8, 24, 2, 10], [8, 24, 2, 10]
    ];
    mazeWalls.forEach(([x, z, w, d]) => addBox(x, 0, z, w, 4.5, d));

    // 石柱（半径1.2m）
    const pillarGeo = new THREE.CylinderGeometry(1.2, 1.4, 7, 16);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x57606f, roughness: 0.7 });
    const pillarPos = [[-12, -8], [12, -8], [-12, 8], [12, 8], [-25, -25], [25, 25], [-25, 25], [25, -25]];
    pillarPos.forEach(([x, z]) => {
      const p = new THREE.Mesh(pillarGeo, pillarMat);
      p.position.set(x, 3.5, z);
      scene.add(p);
      colliders.push(new THREE.Box3().setFromObject(p));
      mapObstacles.push({ x, z, w: 2.5, d: 2.5 });
    });

    // --- 3. シールド & 敵プレイヤー ---
    function createShieldMesh(colorHex = 0x00d2d3) {
      const shieldGeo = new THREE.CircleGeometry(1.0, 6);
      const shieldMat = new THREE.MeshBasicMaterial({
        color: colorHex, transparent: true, opacity: 0.45, side: THREE.DoubleSide
      });
      const shield = new THREE.Mesh(shieldGeo, shieldMat);
      shield.visible = false;
      return shield;
    }

    const myShield = createShieldMesh(0x00d2d3);
    myShield.position.set(0, 0, -1.2);
    camera.add(myShield);
    scene.add(camera);

    const enemyMesh = new THREE.Group();
    const enemyBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.7, 16), new THREE.MeshStandardMaterial({ color: 0xff3838 }));
    enemyBody.position.y = 0.85;
    const enemyHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff6b81 }));
    enemyHead.position.y = 1.8;
    const enemyShield = createShieldMesh(0xff3838);
    enemyShield.position.set(0, 1.2, -0.8);
    enemyMesh.add(enemyBody, enemyHead, enemyShield);
    enemyMesh.visible = false;
    scene.add(enemyMesh);

    // --- 4. 物理演算 & スタック防止スライディング衝突 ---
    const playerRadius = 0.45;
    const eyeHeight = 1.7;
    let velocityY = 0;
    const gravity = -28;
    const jumpStrength = 10;
    let isGrounded = false;
    let myHp = 100;
    let myMp = 100;
    let isGuarding = false;

    // ★修正: 柱（±25, ±25）や壁から完全に離れた安全な開けた地点にスポーン
    function resetSpawn() {
      const spawns = [
        { x: -18, z: -10 }, { x: 18, z: -10 },
        { x: -18, z: 10 },  { x: 18, z: 10 }
      ];
      const s = spawns[Math.floor(Math.random() * spawns.length)];
      camera.position.set(s.x, 2.0, s.z);
      velocityY = 0;
      myHp = 100;
      myMp = 100;
      document.getElementById('hp-bar').style.width = '100%';
      document.getElementById('mp-bar').style.width = '100%';
    }
    resetSpawn();

    // ★修正: スタックしない「物理押し出しスライディング」方式
    function resolveCollision(posX, posZ) {
      let curX = posX;
      let curZ = posZ;
      const footY = camera.position.y - eyeHeight + 0.35; // 足元の段差許容

      for (let box of colliders) {
        // 高さ方向で干渉しているか
        if (footY < box.max.y && (camera.position.y + 0.1) > box.min.y) {
          // AABBに対する最近接点を計算
          const cx = Math.max(box.min.x, Math.min(curX, box.max.x));
          const cz = Math.max(box.min.z, Math.min(curZ, box.max.z));

          const dx = curX - cx;
          const dz = curZ - cz;
          const distSq = dx * dx + dz * dz;

          // プレイヤーの円半径と衝突している場合、外側へ押し出す
          if (distSq < playerRadius * playerRadius) {
            const dist = Math.sqrt(distSq);
            if (dist > 0.0001) {
              const overlap = playerRadius - dist;
              curX += (dx / dist) * overlap;
              curZ += (dz / dist) * overlap;
            } else {
              // 中心が完全に重なってしまった場合の退避
              curX += playerRadius;
            }
          }
        }
      }
      return { x: curX, z: curZ };
    }

    // 接地（床・台座）判定
    function checkGround(py) {
      let groundLevel = 0;
      const pFoot = py - eyeHeight;

      for (let box of colliders) {
        if (camera.position.x >= box.min.x - playerRadius && camera.position.x <= box.max.x + playerRadius &&
            camera.position.z >= box.min.z - playerRadius && camera.position.z <= box.max.z + playerRadius) {
          if (box.max.y <= pFoot + 0.35 && box.max.y > groundLevel) {
            groundLevel = box.max.y;
          }
        }
      }
      return groundLevel + eyeHeight;
    }

    // --- 5. 魔法弾 & 爆発システム ---
    const spells = [];
    const particles = [];

    function createExplosion(pos, colorHex = 0x00f2fe) {
      const pLight = new THREE.PointLight(colorHex, 5, 8);
      pLight.position.copy(pos);
      scene.add(pLight);
      setTimeout(() => scene.remove(pLight), 100);

      const count = 20;
      const pGeo = new THREE.SphereGeometry(0.12, 6, 6);
      const pMat = new THREE.MeshBasicMaterial({ color: colorHex });

      for (let i = 0; i < count; i++) {
        const pMesh = new THREE.Mesh(pGeo, pMat);
        pMesh.position.copy(pos);
        scene.add(pMesh);
        const v = new THREE.Vector3((Math.random() - 0.5) * 16, Math.random() * 12 + 1, (Math.random() - 0.5) * 16);
        particles.push({ mesh: pMesh, v, life: 0.5 + Math.random() * 0.3 });
      }
    }

    function spawnSpell(x, y, z, vx, vy, vz, isMine) {
      const color = isMine ? 0x00f2fe : 0xff4757;
      const spellGroup = new THREE.Group();
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      const glow = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 10), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 }));
      const light = new THREE.PointLight(color, 3, 6);
      spellGroup.add(core, glow, light);
      spellGroup.position.set(x, y, z);
      scene.add(spellGroup);
      spells.push({ group: spellGroup, vx, vy, vz, life: 3.0, isMine, color });
    }

    let shakeIntensity = 0;
    function triggerHitEffect() {
      shakeIntensity = 0.35;
      const overlay = document.getElementById('damage-overlay');
      overlay.style.opacity = '1';
      setTimeout(() => { overlay.style.opacity = '0'; }, 180);
    }

    // --- 6. P2P通信 (PeerJS) ---
    let peer = null, conn = null;

    function initNetwork(roomId) {
      const hostId = `ruins-fps-${roomId}-host`;
      const guestId = `ruins-fps-${roomId}-guest`;

      peer = new Peer(hostId);
      peer.on('open', () => { document.getElementById('info').innerText = '相手の参加を待機中...'; });
      peer.on('connection', (c) => { conn = c; setupEvents(); });
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer = new Peer(guestId);
          peer.on('open', () => { conn = peer.connect(hostId); setupEvents(); });
        }
      });
    }

    function setupEvents() {
      enemyMesh.visible = true;
      document.getElementById('info').innerText = '対戦開始！';

      conn.on('data', (data) => {
        if (data.type === 'move') {
          enemyMesh.position.set(data.x, data.y - eyeHeight, data.z);
          enemyMesh.rotation.y = data.rot;
          enemyShield.visible = data.isGuarding;
        } else if (data.type === 'shoot') {
          spawnSpell(data.x, data.y, data.z, data.vx, data.vy, data.vz, false);
        } else if (data.type === 'hit') {
          let damage = 25;
          if (isGuarding && data.bulletDir) {
            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            const bDir = new THREE.Vector3(data.bulletDir.x, 0, data.bulletDir.z).normalize();
            if (camDir.dot(bDir) < -0.35) {
              damage = 6;
              createExplosion(myShield.getWorldPosition(new THREE.Vector3()), 0x00cec9);
            }
          }

          myHp -= damage;
          triggerHitEffect();
          document.getElementById('hp-bar').style.width = `${Math.max(0, myHp)}%`;
          if (myHp <= 0) {
            document.getElementById('info').innerText = '撃破されました！リスポーン中...';
            setTimeout(() => { resetSpawn(); document.getElementById('info').innerText = '戦闘中'; }, 3000);
          }
        }
      });
    }

    // --- 7. 操作入力 ---
    let isLocked = false;
    let pitch = 0, yaw = 0;
    const keys = {};
    let mouseDownTime = 0;
    let isMouseDown = false;
    let isRightDown = false;

    document.getElementById('start-btn').addEventListener('click', () => {
      const room = document.getElementById('room-input').value.trim() || 'default';
      initNetwork(room);
      document.getElementById('overlay').style.display = 'none';
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      if (!isLocked && myHp > 0) document.getElementById('overlay').style.display = 'flex';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.0022;
      pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch - e.movementY * 0.0022));
    });

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && isGrounded && isLocked && myHp > 0) {
        velocityY = jumpStrength;
        isGrounded = false;
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    window.addEventListener('mousedown', (e) => {
      if (!isLocked || myHp <= 0) return;
      if (e.button === 0) {
        isMouseDown = true;
        mouseDownTime = Date.now();
      } else if (e.button === 2) {
        isRightDown = true;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!isLocked || myHp <= 0) return;
      if (e.button === 0 && isMouseDown) {
        const pressDuration = Date.now() - mouseDownTime;
        isMouseDown = false;
        // 短押し（200ms未満）かつ MP 25以上で発射
        if (pressDuration < 200 && myMp >= 25) {
          fireSpell();
        }
      } else if (e.button === 2) {
        isRightDown = false;
      }
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    function fireSpell() {
      myMp -= 25;
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const sx = camera.position.x + dir.x * 0.6;
      const sy = camera.position.y + dir.y * 0.6;
      const sz = camera.position.z + dir.z * 0.6;
      const speed = 40;
      const vx = dir.x * speed, vy = dir.y * speed, vz = dir.z * speed;

      spawnSpell(sx, sy, sz, vx, vy, vz, true);
      if (conn && conn.open) conn.send({ type: 'shoot', x: sx, y: sy, z: sz, vx, vy, vz });
    }

    // --- 8. ミニマップ ---
    const mapCanvas = document.getElementById('minimap');
    const mapCtx = mapCanvas.getContext('2d');
    const mapScale = 125 / 70;

    function renderMinimap() {
      mapCtx.fillStyle = 'rgba(15, 20, 35, 0.9)';
      mapCtx.fillRect(0, 0, 125, 125);

      mapCtx.fillStyle = '#485460';
      mapObstacles.forEach(o => {
        const mx = (o.x + 35) * mapScale - (o.w * mapScale) / 2;
        const mz = (o.z + 35) * mapScale - (o.d * mapScale) / 2;
        mapCtx.fillRect(mx, mz, o.w * mapScale, o.d * mapScale);
      });

      if (enemyMesh.visible) {
        const ex = (enemyMesh.position.x + 35) * mapScale;
        const ez = (enemyMesh.position.z + 35) * mapScale;
        mapCtx.fillStyle = '#ff4757';
        mapCtx.beginPath();
        mapCtx.arc(ex, ez, 3.5, 0, Math.PI * 2);
        mapCtx.fill();
      }

      const px = (camera.position.x + 35) * mapScale;
      const pz = (camera.position.z + 35) * mapScale;
      mapCtx.fillStyle = '#00d2d3';
      mapCtx.beginPath();
      mapCtx.arc(px, pz, 4, 0, Math.PI * 2);
      mapCtx.fill();

      mapCtx.strokeStyle = '#fff';
      mapCtx.lineWidth = 2;
      mapCtx.beginPath();
      mapCtx.moveTo(px, pz);
      mapCtx.lineTo(px - Math.sin(yaw) * 10, pz - Math.cos(yaw) * 10);
      mapCtx.stroke();
    }

    // --- 9. メインループ ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);

      if (isLocked && myHp > 0) {
        // ガード状態チェック
        const isHoldingLeft = isMouseDown && (Date.now() - mouseDownTime >= 200);
        isGuarding = (isHoldingLeft || isRightDown) && myMp > 0;
        myShield.visible = isGuarding;

        // ★修正: MPの増減（自然回復を毎秒18から毎秒9へと約半分に調整）
        if (isGuarding) {
          myMp = Math.max(0, myMp - 24 * delta);
        } else {
          myMp = Math.min(100, myMp + 9 * delta);
        }
        document.getElementById('mp-bar').style.width = `${myMp}%`;

        // カメラ回転
        camera.rotation.order = 'YXZ';
        let shakeX = 0, shakeY = 0;
        if (shakeIntensity > 0) {
          shakeX = (Math.random() - 0.5) * shakeIntensity;
          shakeY = (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity -= delta * 1.2;
        }
        camera.rotation.y = yaw + shakeX;
        camera.rotation.x = pitch + shakeY;

        // 水平移動
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const moveVec = new THREE.Vector3();

        if (keys['KeyW']) moveVec.add(forward);
        if (keys['KeyS']) moveVec.sub(forward);
        if (keys['KeyD']) moveVec.add(right);
        if (keys['KeyA']) moveVec.sub(right);

        if (moveVec.lengthSq() > 0) {
          moveVec.normalize();
          const speed = isGuarding ? 5.5 : 11;
          const targetX = camera.position.x + moveVec.x * speed * delta;
          const targetZ = camera.position.z + moveVec.z * speed * delta;
          const resolved = resolveCollision(targetX, targetZ);
          camera.position.x = resolved.x;
          camera.position.z = resolved.z;
        }

        // 垂直移動 & 接地判定
        velocityY += gravity * delta;
        camera.position.y += velocityY * delta;
        const targetFloorY = checkGround(camera.position.y);
        if (camera.position.y <= targetFloorY) {
          camera.position.y = targetFloorY;
          velocityY = 0;
          isGrounded = true;
        } else {
          isGrounded = false;
        }

        // 同期送信
        if (conn && conn.open) {
          conn.send({
            type: 'move',
            x: camera.position.x,
            y: camera.position.y,
            z: camera.position.z,
            rot: yaw,
            isGuarding
          });
        }

        renderMinimap();
      }

      // パーティクル
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= delta;
        p.v.y += gravity * 0.6 * delta;
        p.mesh.position.addScaledVector(p.v, delta);
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      // 弾の更新 & コリジョン判定
      const spellSphere = new THREE.Sphere(new THREE.Vector3(), 0.35);
      for (let i = spells.length - 1; i >= 0; i--) {
        const s = spells[i];
        s.life -= delta;
        s.group.position.x += s.vx * delta;
        s.group.position.y += s.vy * delta;
        s.group.position.z += s.vz * delta;
        spellSphere.center.copy(s.group.position);

        let collided = false;
        for (let box of colliders) {
          if (box.intersectsSphere(spellSphere)) { collided = true; break; }
        }
        if (s.group.position.y <= 0.2) collided = true;

        if (!s.isMine && myHp > 0) {
          if (camera.position.distanceTo(s.group.position) < 1.3) {
            collided = true;
            if (conn && conn.open) {
              conn.send({
                type: 'hit',
                bulletDir: { x: s.vx, y: s.vy, z: s.vz }
              });
            }
          }
        }

        if (collided || s.life <= 0) {
          createExplosion(s.group.position, s.color);
          scene.remove(s.group);
          spells.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
