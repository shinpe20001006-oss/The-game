<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Magic FPS Duel - Ruins Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #05070d; font-family: sans-serif; }
    #ui { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; border: 2px solid rgba(0, 242, 254, 0.7);
      border-radius: 50%; pointer-events: none;
    }
    #crosshair::after {
      content: ''; position: absolute; top: 4px; left: 4px; width: 2px; height: 2px;
      background: #fff; border-radius: 50%;
    }
    #hud { position: absolute; bottom: 24px; left: 24px; color: #fff; }
    .bar-bg { width: 220px; height: 18px; background: rgba(0,0,0,0.5); border: 2px solid #55e6c1; border-radius: 4px; overflow: hidden; }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); transition: width 0.15s; }
    #info { margin-top: 8px; font-size: 15px; font-weight: bold; text-shadow: 0 0 4px #000; color: #55e6c1; }
    
    #damage-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, transparent 60%, rgba(255, 0, 0, 0.6) 100%);
      opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out;
    }

    #overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 7, 13, 0.88); display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; z-index: 10;
    }
    #overlay h1 { font-size: 42px; margin-bottom: 12px; color: #00d2d3; text-shadow: 0 0 25px #00d2d3; letter-spacing: 3px; }
    #overlay p { margin-bottom: 6px; font-size: 15px; color: #ccc; }
    .controls { margin-bottom: 24px; color: #888; font-size: 13px; }
    .btn {
      padding: 12px 32px; font-size: 18px; background: #10ac84; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      box-shadow: 0 0 15px rgba(16, 172, 132, 0.4);
    }
    .btn:hover { background: #1dd1a1; }
    #room-input { padding: 10px; font-size: 16px; border-radius: 6px; border: 2px solid #10ac84; margin-bottom: 16px; text-align: center; background: #222; color: #fff; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="damage-overlay"></div>

  <div id="ui">
    <div id="crosshair"></div>
    <div id="hud">
      <div class="bar-bg"><div id="hp-bar"></div></div>
      <div id="info">準備中...</div>
    </div>
  </div>

  <div id="overlay">
    <h1>RUINS OF MAGIC</h1>
    <p>3D 一人称 魔法決闘アリーナ</p>
    <p class="controls">【WASD】移動　【SPACE】ジャンプ　【マウス】照準　【左クリック】魔法弾</p>
    <input type="text" id="room-input" placeholder="合言葉（ルーム名）" value="arena888">
    <button class="btn" id="start-btn">参戦する</button>
  </div>

  <script>
    // --- 1. 基本シーン & ライティング ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x2d3436, 1.2));
    const moonLight = new THREE.DirectionalLight(0x74b9ff, 1.0);
    moonLight.position.set(30, 60, 20);
    moonLight.castShadow = true;
    scene.add(moonLight);

    // --- 2. 複雑な遺跡ステージの生成 & コリジョン登録 ---
    const colliders = []; // 当たり判定用バウンディングボックス

    function addBox(x, y, z, w, h, d, color = 0x2f3640) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.2 })
      );
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const box = new THREE.Box3().setFromObject(mesh);
      colliders.push(box);
      return mesh;
    }

    // 床 (64m x 64m)
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 70),
      new THREE.MeshStandardMaterial({ color: 0x191e24, roughness: 0.9 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 外壁（アリーナ境界）
    addBox(0, 0, -35, 70, 8, 2, 0x1e272e);
    addBox(0, 0, 35, 70, 8, 2, 0x1e272e);
    addBox(-35, 0, 0, 2, 8, 70, 0x1e272e);
    addBox(35, 0, 0, 2, 8, 70, 0x1e272e);

    // 中央の高台テラス（2段構造）
    addBox(0, 0, 0, 14, 2.5, 14, 0x353b48);   // 1段目
    addBox(0, 2.5, 0, 8, 2.5, 8, 0x2f3640);    // 2段目（最上段）
    addBox(0, 5.0, 0, 2, 4.0, 2, 0x00d2d3);    // 中央オベリスク柱

    // 高台へのスロープ/踏み台ブロック（登れる階段代わり）
    addBox(0, 0, 9, 4, 1.25, 4);
    addBox(0, 0, -9, 4, 1.25, 4);
    addBox(9, 0, 0, 4, 1.25, 4);
    addBox(-9, 0, 0, 4, 1.25, 4);

    // 遺跡の壁・迷路状の遮蔽物（クランク状に配置）
    const mazeWalls = [
      // x, z, w, d
      [-16, -16, 12, 2], [-16, 16, 12, 2], [16, -16, 12, 2], [16, 16, 12, 2],
      [-22, 0, 2, 16], [22, 0, 2, 16],
      [-8, -24, 2, 10], [8, -24, 2, 10], [-8, 24, 2, 10], [8, 24, 2, 10]
    ];
    mazeWalls.forEach(([x, z, w, d]) => addBox(x, 0, z, w, 4.5, d));

    // 高い石柱
    const pillarGeo = new THREE.CylinderGeometry(1.2, 1.4, 7, 16);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x57606f, roughness: 0.7 });
    const pillarPos = [[-12, -8], [12, -8], [-12, 8], [12, 8], [-25, -25], [25, 25], [-25, 25], [25, -25]];
    pillarPos.forEach(([x, z]) => {
      const p = new THREE.Mesh(pillarGeo, pillarMat);
      p.position.set(x, 3.5, z);
      p.castShadow = true;
      scene.add(p);
      colliders.push(new THREE.Box3().setFromObject(p));
    });

    // --- 3. 敵プレイヤー描画 ---
    const enemyMesh = new THREE.Group();
    const enemyBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.7, 16), new THREE.MeshStandardMaterial({ color: 0xff3838, roughness: 0.3 }));
    enemyBody.position.y = 0.85;
    const enemyHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff6b81 }));
    enemyHead.position.y = 1.8;
    enemyMesh.add(enemyBody, enemyHead);
    enemyMesh.visible = false;
    scene.add(enemyMesh);

    // --- 4. プレイヤー物理 & コリジョン移動 ---
    const playerRadius = 0.5;
    const eyeHeight = 1.7;
    let velocityY = 0;
    const gravity = -28;
    const jumpStrength = 10;
    let isGrounded = false;
    let myHp = 100;

    function resetSpawn() {
      const spawns = [
        { x: -28, z: -28 }, { x: 28, z: 28 }, { x: -28, z: 28 }, { x: 28, z: -28 }
      ];
      const s = spawns[Math.floor(Math.random() * spawns.length)];
      camera.position.set(s.x, 2, s.z);
      velocityY = 0;
      myHp = 100;
      document.getElementById('hp-bar').style.width = '100%';
    }
    resetSpawn();

    // プレイヤーと障害物のめり込み解消
    function resolveCollision(newX, newZ) {
      let finalX = newX;
      let finalZ = newZ;
      const playerBox = new THREE.Box3();

      // X軸移動の判定
      playerBox.min.set(finalX - playerRadius, camera.position.y - eyeHeight, camera.position.z - playerRadius);
      playerBox.max.set(finalX + playerRadius, camera.position.y + 0.2, camera.position.z + playerRadius);
      for (let box of colliders) {
        if (box.intersectsBox(playerBox)) {
          finalX = camera.position.x; // 衝突したらX移動をキャンセル
          break;
        }
      }

      // Z軸移動の判定
      playerBox.min.set(finalX - playerRadius, camera.position.y - eyeHeight, finalZ - playerRadius);
      playerBox.max.set(finalX + playerRadius, camera.position.y + 0.2, finalZ + playerRadius);
      for (let box of colliders) {
        if (box.intersectsBox(playerBox)) {
          finalZ = camera.position.z; // 衝突したらZ移動をキャンセル
          break;
        }
      }

      return { x: finalX, z: finalZ };
    }

    // 床・台座の上への着地判定
    function checkGround(py) {
      let groundLevel = 0; // 最低床面
      const pFoot = py - eyeHeight;

      for (let box of colliders) {
        if (camera.position.x >= box.min.x - playerRadius && camera.position.x <= box.max.x + playerRadius &&
            camera.position.z >= box.min.z - playerRadius && camera.position.z <= box.max.z + playerRadius) {
          if (box.max.y <= pFoot + 0.3 && box.max.y > groundLevel) {
            groundLevel = box.max.y;
          }
        }
      }
      return groundLevel + eyeHeight;
    }

    // --- 5. 激しい魔法弾 & 爆発パーティクルシステム ---
    const spells = [];
    const particles = [];

    function createExplosion(pos, colorHex = 0x00f2fe) {
      // 閃光
      const pLight = new THREE.PointLight(colorHex, 6, 8);
      pLight.position.copy(pos);
      scene.add(pLight);
      setTimeout(() => scene.remove(pLight), 120);

      // 四散する火花・破片パーティクル
      const count = 28;
      const pGeo = new THREE.SphereGeometry(0.12, 6, 6);
      const pMat = new THREE.MeshBasicMaterial({ color: colorHex });

      for (let i = 0; i < count; i++) {
        const pMesh = new THREE.Mesh(pGeo, pMat);
        pMesh.position.copy(pos);
        scene.add(pMesh);

        const v = new THREE.Vector3(
          (Math.random() - 0.5) * 16,
          Math.random() * 12 + 2,
          (Math.random() - 0.5) * 16
        );
        particles.push({ mesh: pMesh, v, life: 0.6 + Math.random() * 0.4 });
      }
    }

    function spawnSpell(x, y, z, vx, vy, vz, isMine) {
      const color = isMine ? 0x00f2fe : 0xff4757;
      
      const spellGroup = new THREE.Group();
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 12, 12),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 })
      );
      const light = new THREE.PointLight(color, 3, 7);

      spellGroup.add(core, glow, light);
      spellGroup.position.set(x, y, z);
      scene.add(spellGroup);

      spells.push({ group: spellGroup, vx, vy, vz, life: 3.0, isMine, color });
    }

    // カメラ揺れ（被弾時）
    let shakeIntensity = 0;
    function triggerHitEffect() {
      shakeIntensity = 0.35;
      const overlay = document.getElementById('damage-overlay');
      overlay.style.opacity = '1';
      setTimeout(() => { overlay.style.opacity = '0'; }, 180);
    }

    // --- 6. P2P通信 (PeerJS) ---
    let peer = null, conn = null;

    function initNetwork(roomId) {
      const hostId = `ruins-fps-${roomId}-host`;
      const guestId = `ruins-fps-${roomId}-guest`;

      peer = new Peer(hostId);
      peer.on('open', () => {
        document.getElementById('info').innerText = '相手の参加を待っています...';
      });

      peer.on('connection', (c) => {
        conn = c;
        setupEvents();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer = new Peer(guestId);
          peer.on('open', () => {
            conn = peer.connect(hostId);
            setupEvents();
          });
        }
      });
    }

    function setupEvents() {
      enemyMesh.visible = true;
      document.getElementById('info').innerText = '相手が侵入！決闘開始！';

      conn.on('data', (data) => {
        if (data.type === 'move') {
          enemyMesh.position.set(data.x, data.y - eyeHeight, data.z);
          enemyMesh.rotation.y = data.rot;
        } else if (data.type === 'shoot') {
          spawnSpell(data.x, data.y, data.z, data.vx, data.vy, data.vz, false);
        } else if (data.type === 'hit') {
          myHp -= 25;
          triggerHitEffect();
          document.getElementById('hp-bar').style.width = `${Math.max(0, myHp)}%`;
          if (myHp <= 0) {
            document.getElementById('info').innerText = '敗北！3秒後にリスポーン...';
            setTimeout(() => {
              resetSpawn();
              document.getElementById('info').innerText = '戦闘再開';
            }, 3000);
          }
        }
      });
    }

    // --- 7. 操作入力（前後左右・ジャンプの修正版） ---
    let isLocked = false;
    let pitch = 0, yaw = 0;
    const keys = {};

    document.getElementById('start-btn').addEventListener('click', () => {
      const room = document.getElementById('room-input').value.trim() || 'default';
      initNetwork(room);
      document.getElementById('overlay').style.display = 'none';
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      if (!isLocked && myHp > 0) {
        document.getElementById('overlay').style.display = 'flex';
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.0022;
      pitch -= e.movementY * 0.0022;
      pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
    });

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // ジャンプ処理
      if (e.code === 'Space' && isGrounded && isLocked && myHp > 0) {
        velocityY = jumpStrength;
        isGrounded = false;
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    let canShoot = true;
    window.addEventListener('mousedown', (e) => {
      if (!isLocked || e.button !== 0 || !canShoot || myHp <= 0) return;
      canShoot = false;
      setTimeout(() => { canShoot = true; }, 320); // 攻撃間隔

      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const sx = camera.position.x + dir.x * 0.6;
      const sy = camera.position.y + dir.y * 0.6;
      const sz = camera.position.z + dir.z * 0.6;
      const speed = 40;
      const vx = dir.x * speed, vy = dir.y * speed, vz = dir.z * speed;

      spawnSpell(sx, sy, sz, vx, vy, vz, true);

      if (conn && conn.open) {
        conn.send({ type: 'shoot', x: sx, y: sy, z: sz, vx, vy, vz });
      }
    });

    // --- 8. メインループ ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      if (isLocked && myHp > 0) {
        // カメラ向き反映（＋揺れ）
        camera.rotation.order = 'YXZ';
        let shakeX = 0, shakeY = 0;
        if (shakeIntensity > 0) {
          shakeX = (Math.random() - 0.5) * shakeIntensity;
          shakeY = (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity -= delta * 1.2;
        }
        camera.rotation.y = yaw + shakeX;
        camera.rotation.x = pitch + shakeY;

        // 正しい前後左右のベクトル計算（反転なし）
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const moveVec = new THREE.Vector3();

        if (keys['KeyW']) moveVec.add(forward);
        if (keys['KeyS']) moveVec.sub(forward);
        if (keys['KeyD']) moveVec.add(right);
        if (keys['KeyA']) moveVec.sub(right);

        if (moveVec.lengthSq() > 0) {
          moveVec.normalize();
          const speed = 11;
          const targetX = camera.position.x + moveVec.x * speed * delta;
          const targetZ = camera.position.z + moveVec.z * speed * delta;
          const resolved = resolveCollision(targetX, targetZ);
          camera.position.x = resolved.x;
          camera.position.z = resolved.z;
        }

        // 重力・垂直移動
        velocityY += gravity * delta;
        camera.position.y += velocityY * delta;

        // 接地判定
        const targetFloorY = checkGround(camera.position.y);
        if (camera.position.y <= targetFloorY) {
          camera.position.y = targetFloorY;
          velocityY = 0;
          isGrounded = true;
        } else {
          isGrounded = false;
        }

        // 相手に位置送信（Y座標も含む）
        if (conn && conn.open) {
          conn.send({
            type: 'move',
            x: camera.position.x,
            y: camera.position.y,
            z: camera.position.z,
            rot: yaw
          });
        }
      }

      // パーティクル更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= delta;
        p.v.y += gravity * 0.6 * delta;
        p.mesh.position.addScaledVector(p.v, delta);
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      // 魔法弾の更新 ＆ 衝突判定（壁・床・プレイヤー）
      const spellSphere = new THREE.Sphere(new THREE.Vector3(), 0.35);
      for (let i = spells.length - 1; i >= 0; i--) {
        const s = spells[i];
        s.life -= delta;
        s.group.position.x += s.vx * delta;
        s.group.position.y += s.vy * delta;
        s.group.position.z += s.vz * delta;

        spellSphere.center.copy(s.group.position);

        let collided = false;

        // 1. 壁や柱との当たり判定
        for (let box of colliders) {
          if (box.intersectsSphere(spellSphere)) {
            collided = true;
            break;
          }
        }

        // 2. 床との衝突
        if (s.group.position.y <= 0.2) collided = true;

        // 3. 相手の弾が自分に直撃
        if (!s.isMine && myHp > 0) {
          if (camera.position.distanceTo(s.group.position) < 1.3) {
            collided = true;
            if (conn && conn.open) conn.send({ type: 'hit' });
          }
        }

        if (collided || s.life <= 0) {
          createExplosion(s.group.position, s.color);
          scene.remove(s.group);
          spells.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
