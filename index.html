<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Magic FPS Duel - Sky Ruins</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #81ecec; font-family: sans-serif; }
    #ui { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
    
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 16px; height: 16px; border: 2px solid #0984e3;
      border-radius: 50%; pointer-events: none;
    }
    #crosshair::after {
      content: ''; position: absolute; top: 5px; left: 5px; width: 2px; height: 2px;
      background: #d63031; border-radius: 50%;
    }

    /* 正確なコンパスHUD */
    #compass-container {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      width: 240px; height: 32px; background: rgba(0, 0, 0, 0.6);
      border: 1px solid #74b9ff; border-radius: 16px; overflow: hidden;
    }
    #compass-tape {
      display: flex; position: absolute; font-weight: bold; font-size: 14px;
      color: #fff; white-space: nowrap; height: 100%; align-items: center;
    }
    .compass-pointer {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 6px solid transparent;
      border-right: 6px solid transparent; border-top: 7px solid #ff7675; z-index: 2;
    }

    #hud { position: absolute; bottom: 20px; left: 160px; color: #fff; }
    .bar-label { font-size: 11px; font-weight: bold; margin-bottom: 2px; text-shadow: 1px 1px 2px #000; color: #2d3436; }
    .bar-bg { width: 200px; height: 14px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); transition: width 0.15s; }
    #mp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #0984e3, #00cec9); transition: width 0.08s; }
    
    .overheat {
      background: linear-gradient(90deg, #d63031, #e17055) !important;
      animation: blink 0.5s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }

    #info { margin-top: 4px; font-size: 13px; font-weight: bold; color: #2d3436; text-shadow: 0 0 4px #fff; }

    /* 操作ガイド（ポインター外れ時） */
    #click-to-focus {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6); color: #fff; padding: 6px 16px;
      border-radius: 20px; font-size: 13px; display: none;
    }

    #minimap-container {
      position: absolute; bottom: 20px; left: 20px;
      width: 125px; height: 125px; background: rgba(255, 255, 255, 0.85);
      border: 2px solid #0984e3; border-radius: 6px; overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    #minimap { width: 100%; height: 100%; }

    #damage-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, transparent 60%, rgba(255, 0, 0, 0.6) 100%);
      opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out;
    }

    /* スタート画面 */
    #overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(245, 246, 250, 0.96); display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #2d3436; z-index: 10;
    }
    #overlay h1 { font-size: 40px; margin-bottom: 10px; color: #0984e3; letter-spacing: 2px; }
    #overlay p { margin-bottom: 6px; font-size: 14px; color: #636e72; }
    .controls { margin-bottom: 24px; color: #2d3436; font-size: 13px; line-height: 1.6; text-align: center; }
    .btn {
      padding: 12px 40px; font-size: 18px; background: #0984e3; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      box-shadow: 0 4px 12px rgba(9, 132, 227, 0.3);
    }
    .btn:hover { background: #74b9ff; }
    #room-input { padding: 10px; font-size: 16px; border-radius: 6px; border: 2px solid #0984e3; margin-bottom: 16px; text-align: center; background: #fff; color: #2d3436; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="damage-overlay"></div>

  <div id="ui">
    <div id="crosshair"></div>

    <div id="compass-container">
      <div class="compass-pointer"></div>
      <div id="compass-tape"></div>
    </div>

    <div id="click-to-focus">画面をクリックして視点操作を開始</div>

    <div id="minimap-container">
      <canvas id="minimap" width="125" height="125"></canvas>
    </div>

    <div id="hud">
      <div class="bar-label">HP</div>
      <div class="bar-bg"><div id="hp-bar"></div></div>
      <div class="bar-label" id="mp-label">MP (MANA)</div>
      <div class="bar-bg"><div id="mp-bar"></div></div>
      <div id="info">合言葉を入力して参戦</div>
    </div>
  </div>

  <div id="overlay">
    <h1>SKY RUINS DUEL</h1>
    <p>3D 一人称 魔法決闘アリーナ</p>
    <p class="controls">
      【WASD】移動　【SPACE】ジャンプ　【マウス】照準<br>
      【左クリック】魔法弾発射（MP 25消費 / 12〜24でも全MP消費して発射可！）<br>
      【長押し or 右クリック】ガード展開（維持毎秒15MP・被弾時MP-30）<br>
      <span style="color:#d63031;">※MP枯渇時はフルチャージまで一切の行動不可</span>
    </p>
    <input type="text" id="room-input" placeholder="合言葉（ルーム名）" value="arena888">
    <button class="btn" id="start-btn">参戦する</button>
  </div>

  <script>
    // --- 1. 明るい昼間シーン ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x81ecec);
    scene.fog = new THREE.Fog(0x81ecec, 45, 110);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    const sunLight = new THREE.DirectionalLight(0xfffae6, 1.2);
    sunLight.position.set(40, 80, 40);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // --- 2. 遺跡ステージ & 天井 & 登りやすい中央高台 ---
    const colliders = [];
    const mapObstacles = [];

    function addBox(x, y, z, w, h, d, color = 0xdfe6e9) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1 })
      );
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const box = new THREE.Box3().setFromObject(mesh);
      colliders.push(box);
      mapObstacles.push({ x, z, w, d });
      return mesh;
    }

    // 床
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 70),
      new THREE.MeshStandardMaterial({ color: 0xf5f6fa, roughness: 0.6 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(70, 35, 0x0984e3, 0xb2bec3);
    grid.position.y = 0.02;
    scene.add(grid);

    // 天井（14m）
    const ceiling = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 70),
      new THREE.MeshStandardMaterial({ color: 0x74b9ff, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
    );
    ceiling.position.y = 14;
    ceiling.rotation.x = Math.PI / 2;
    scene.add(ceiling);
    colliders.push(new THREE.Box3(new THREE.Vector3(-35, 14, -35), new THREE.Vector3(35, 16, 35)));

    // 外壁
    addBox(0, 0, -35, 70, 14, 2, 0xb2bec3);
    addBox(0, 0, 35, 70, 8, 2, 0xb2bec3);
    addBox(-35, 0, 0, 2, 14, 70, 0xb2bec3);
    addBox(35, 0, 0, 2, 14, 70, 0xb2bec3);

    // 中央高台（1段目 1.8m、2段目 3.6m、3段目 5.2m）
    addBox(0, 0, 0, 16, 1.8, 16, 0x636e72);
    addBox(0, 1.8, 0, 10, 1.8, 10, 0x74b9ff);
    addBox(0, 3.6, 0, 5, 1.6, 5, 0x0984e3);

    // 階段・ステップ
    addBox(0, 0, 10, 4, 0.9, 3, 0xb2bec3);
    addBox(0, 0, -10, 4, 0.9, 3, 0xb2bec3);
    addBox(0, 1.8, 6, 3, 0.9, 2, 0xb2bec3);
    addBox(0, 1.8, -6, 3, 0.9, 2, 0xb2bec3);
    addBox(0, 3.6, 3.2, 2.4, 0.8, 1.4, 0xb2bec3);
    addBox(0, 3.6, -3.2, 2.4, 0.8, 1.4, 0xb2bec3);

    // 迷路壁
    const mazeWalls = [
      [-16, -16, 12, 2], [-16, 16, 12, 2], [16, -16, 12, 2], [16, 16, 12, 2],
      [-22, 0, 2, 16], [22, 0, 2, 16],
      [-8, -24, 2, 10], [8, -24, 2, 10], [-8, 24, 2, 10], [8, 24, 2, 10]
    ];
    mazeWalls.forEach(([x, z, w, d]) => addBox(x, 0, z, w, 4.5, d, 0xdfe6e9));

    // 石柱
    const pillarGeo = new THREE.CylinderGeometry(1.2, 1.4, 7, 16);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xa4b0be, roughness: 0.5 });
    const pillarPos = [[-12, -8], [12, -8], [-12, 8], [12, 8], [-25, -25], [25, 25], [-25, 25], [25, -25]];
    pillarPos.forEach(([x, z]) => {
      const p = new THREE.Mesh(pillarGeo, pillarMat);
      p.position.set(x, 3.5, z);
      p.castShadow = true;
      scene.add(p);
      colliders.push(new THREE.Box3().setFromObject(p));
      mapObstacles.push({ x, z, w: 2.8, d: 2.8 });
    });

    // --- 3. 自機 & 敵シールド ---
    function createShieldMesh(colorHex = 0x00d2d3) {
      const shield = new THREE.Mesh(
        new THREE.CircleGeometry(1.0, 6),
        new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
      );
      shield.visible = false;
      return shield;
    }

    const myShield = createShieldMesh(0x0984e3);
    myShield.position.set(0, 0, -1.2);
    camera.add(myShield);
    scene.add(camera);

    const enemyMesh = new THREE.Group();
    const enemyBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.7, 16), new THREE.MeshStandardMaterial({ color: 0xff4757 }));
    enemyBody.position.y = 0.85;
    const enemyHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff6b81 }));
    enemyHead.position.y = 1.8;
    const enemyShield = createShieldMesh(0xff4757);
    enemyShield.position.set(0, 1.2, -0.8);
    enemyMesh.add(enemyBody, enemyHead, enemyShield);
    enemyMesh.visible = false;
    scene.add(enemyMesh);

    // --- 4. プレイヤー物理 & スポーン ---
    const playerRadius = 0.45;
    const eyeHeight = 1.7;
    let velocityY = 0;
    const gravity = -28;
    const jumpStrength = 10;
    let isGrounded = false;
    let myHp = 100;
    let myMp = 100;
    let isOverheated = false;
    let isGuarding = false;
    let gameActive = false;

    const safeSpawns = [
      { x: 0, z: -28 }, { x: 0, z: 28 }, { x: -28, z: 0 }, { x: 28, z: 0 }
    ];

    function resetSpawn() {
      const s = safeSpawns[Math.floor(Math.random() * safeSpawns.length)];
      camera.position.set(s.x, eyeHeight, s.z);
      velocityY = 0;
      myHp = 100;
      myMp = 100;
      isOverheated = false;
      document.getElementById('hp-bar').style.width = '100%';
      document.getElementById('mp-bar').style.width = '100%';
      document.getElementById('mp-bar').classList.remove('overheat');
      document.getElementById('mp-label').innerText = 'MP (MANA)';
      document.getElementById('mp-label').style.color = '#2d3436';
      document.getElementById('info').innerText = '戦闘中';

      if (conn && conn.open) conn.send({ type: 'respawned' });
    }
    resetSpawn();

    function resolveCollision(newX, newZ) {
      let finalX = newX, finalZ = newZ;
      const playerBox = new THREE.Box3();
      const footHeight = camera.position.y - eyeHeight + 0.35;
      const topHeight = camera.position.y + 0.1;

      playerBox.min.set(finalX - playerRadius, footHeight, camera.position.z - playerRadius);
      playerBox.max.set(finalX + playerRadius, topHeight, camera.position.z + playerRadius);
      for (let box of colliders) {
        if (box.intersectsBox(playerBox)) {
          finalX = camera.position.x;
          break;
        }
      }

      playerBox.min.set(finalX - playerRadius, footHeight, finalZ - playerRadius);
      playerBox.max.set(finalX + playerRadius, topHeight, finalZ + playerRadius);
      for (let box of colliders) {
        if (box.intersectsBox(playerBox)) {
          finalZ = camera.position.z;
          break;
        }
      }
      return { x: finalX, z: finalZ };
    }

    function checkGround(py) {
      let groundLevel = 0;
      const pFoot = py - eyeHeight;
      for (let box of colliders) {
        if (camera.position.x >= box.min.x - playerRadius && camera.position.x <= box.max.x + playerRadius &&
            camera.position.z >= box.min.z - playerRadius && camera.position.z <= box.max.z + playerRadius) {
          if (box.max.y <= pFoot + 0.4 && box.max.y > groundLevel) {
            groundLevel = box.max.y;
          }
        }
      }
      return groundLevel + eyeHeight;
    }

    // --- 5. 魔法弾 & エフェクト ---
    const spells = [];
    const particles = [];

    function createExplosion(pos, colorHex = 0x0984e3) {
      const pLight = new THREE.PointLight(colorHex, 5, 8);
      pLight.position.copy(pos);
      scene.add(pLight);
      setTimeout(() => scene.remove(pLight), 100);

      const count = 22;
      const pGeo = new THREE.SphereGeometry(0.12, 6, 6);
      const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
      for (let i = 0; i < count; i++) {
        const pMesh = new THREE.Mesh(pGeo, pMat);
        pMesh.position.copy(pos);
        scene.add(pMesh);
        const v = new THREE.Vector3((Math.random() - 0.5) * 16, Math.random() * 12 + 1, (Math.random() - 0.5) * 16);
        particles.push({ mesh: pMesh, v, life: 0.5 + Math.random() * 0.3 });
      }
    }

    function spawnSpell(x, y, z, vx, vy, vz, isMine) {
      const color = isMine ? 0x0984e3 : 0xff4757;
      const spellGroup = new THREE.Group();
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      const glow = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 10), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 }));
      const light = new THREE.PointLight(color, 3, 6);
      spellGroup.add(core, glow, light);
      spellGroup.position.set(x, y, z);
      scene.add(spellGroup);
      spells.push({ group: spellGroup, vx, vy, vz, life: 3.0, isMine, color });
    }

    let shakeIntensity = 0;
    function triggerHitEffect() {
      shakeIntensity = 0.35;
      const overlay = document.getElementById('damage-overlay');
      overlay.style.opacity = '1';
      setTimeout(() => { overlay.style.opacity = '0'; }, 180);
    }

    // --- 6. P2P通信 (PeerJS) ---
    let peer = null, conn = null;

    function initNetwork(roomId) {
      try {
        const hostId = `skyruins-${roomId}-host`;
        const guestId = `skyruins-${roomId}-guest`;

        peer = new Peer(hostId);
        peer.on('open', () => { document.getElementById('info').innerText = '相手の参加を待機中...'; });
        peer.on('connection', (c) => { conn = c; setupEvents(); });
        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            peer = new Peer(guestId);
            peer.on('open', () => { conn = peer.connect(hostId); setupEvents(); });
          }
        });
      } catch (e) {
        console.warn('Network offline or error:', e);
      }
    }

    function setupEvents() {
      enemyMesh.visible = true;
      document.getElementById('info').innerText = '対戦開始！';

      conn.on('data', (data) => {
        if (data.type === 'move') {
          enemyMesh.position.set(data.x, data.y - eyeHeight, data.z);
          enemyMesh.rotation.y = data.rot;
          enemyShield.visible = data.isGuarding;
        } else if (data.type === 'shoot') {
          spawnSpell(data.x, data.y, data.z, data.vx, data.vy, data.vz, false);
        } else if (data.type === 'enemyKilled') {
          document.getElementById('info').innerText = '相手を撃破しました！';
        } else if (data.type === 'respawned') {
          document.getElementById('info').innerText = '戦闘中';
        }
      });
    }

    // --- 7. 操作入力（絶対に止まらない堅牢な開始制御） ---
    let isLocked = false;
    let pitch = 0, yaw = 0;
    const keys = {};
    let mouseDownTime = 0;
    let isMouseDown = false;
    let isRightDown = false;
    let lastShootTime = 0;

    const overlay = document.getElementById('overlay');
    const clickPrompt = document.getElementById('click-to-focus');

    // ★「参戦する」ボタンを押したら確実にゲームを開始
    document.getElementById('start-btn').addEventListener('click', () => {
      const room = document.getElementById('room-input').value.trim() || 'default';
      initNetwork(room);
      gameActive = true;
      overlay.style.display = 'none';

      // ポインターロック試行
      try {
        document.body.requestPointerLock();
      } catch(e) { console.log(e); }
    });

    // 画面クリックでいつでもポインターロック再取得
    window.addEventListener('click', (e) => {
      if (gameActive && !isLocked && e.target.id !== 'start-btn') {
        try {
          document.body.requestPointerLock();
        } catch(e) {}
      }
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      if (gameActive) {
        clickPrompt.style.display = isLocked ? 'none' : 'block';
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.0022;
      pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch - e.movementY * 0.0022));
    });

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && isGrounded && gameActive && myHp > 0) {
        velocityY = jumpStrength;
        isGrounded = false;
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    window.addEventListener('mousedown', (e) => {
      if (!gameActive || myHp <= 0) return;

      if (e.button === 0) {
        isMouseDown = true;
        mouseDownTime = Date.now();

        const now = Date.now();
        if (now - lastShootTime >= 180 && !isOverheated) {
          if (myMp >= 25) {
            myMp -= 25;
            fireSpell();
            lastShootTime = now;
            if (myMp <= 0.01) { myMp = 0; triggerOverheat(); }
          } else if (myMp >= 12) {
            myMp = 0;
            fireSpell();
            lastShootTime = now;
            triggerOverheat();
          }
        }
      } else if (e.button === 2) {
        isRightDown = true;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!gameActive || myHp <= 0) return;
      if (e.button === 0) isMouseDown = false;
      else if (e.button === 2) isRightDown = false;
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    function fireSpell() {
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const sx = camera.position.x + dir.x * 0.6;
      const sy = camera.position.y + dir.y * 0.6;
      const sz = camera.position.z + dir.z * 0.6;
      const speed = 42;
      const vx = dir.x * speed, vy = dir.y * speed, vz = dir.z * speed;

      spawnSpell(sx, sy, sz, vx, vy, vz, true);
      if (conn && conn.open) conn.send({ type: 'shoot', x: sx, y: sy, z: sz, vx, vy, vz });
    }

    function triggerOverheat() {
      isOverheated = true;
      isGuarding = false;
      myShield.visible = false;
      const mpBar = document.getElementById('mp-bar');
      mpBar.classList.add('overheat');
      const mpLabel = document.getElementById('mp-label');
      mpLabel.innerText = 'OVERHEAT! (フル回復まで行動不能)';
      mpLabel.style.color = '#d63031';
    }

    // --- 8. コンパス ＆ ミニマップ ---
    const compassTape = document.getElementById('compass-tape');
    const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    let tapeHTML = '';
    for (let r = 0; r < 3; r++) {
      directions.forEach(d => {
        tapeHTML += `<span style="display:inline-block; width:60px; text-align:center;">${d}</span>`;
      });
    }
    compassTape.innerHTML = tapeHTML;

    function updateCompass() {
      let clockDeg = (-THREE.MathUtils.radToDeg(yaw)) % 360;
      if (clockDeg < 0) clockDeg += 360;
      const px = (clockDeg / 45) * 60;
      compassTape.style.transform = `translateX(${120 - 510 - px}px)`;
    }

    const mapCanvas = document.getElementById('minimap');
    const mapCtx = mapCanvas.getContext('2d');
    const mapScale = 125 / 70;

    function renderMinimap() {
      mapCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      mapCtx.fillRect(0, 0, 125, 125);

      mapCtx.fillStyle = '#0984e3';
      mapCtx.font = 'bold 10px sans-serif';
      mapCtx.fillText('N', 58, 12);

      mapCtx.fillStyle = '#b2bec3';
      mapObstacles.forEach(o => {
        const mx = (o.x + 35) * mapScale - (o.w * mapScale) / 2;
        const mz = (o.z + 35) * mapScale - (o.d * mapScale) / 2;
        mapCtx.fillRect(mx, mz, o.w * mapScale, o.d * mapScale);
      });

      if (enemyMesh.visible) {
        const ex = (enemyMesh.position.x + 35) * mapScale;
        const ez = (enemyMesh.position.z + 35) * mapScale;
        mapCtx.fillStyle = '#ff4757';
        mapCtx.beginPath();
        mapCtx.arc(ex, ez, 4, 0, Math.PI * 2);
        mapCtx.fill();
      }

      const px = (camera.position.x + 35) * mapScale;
      const pz = (camera.position.z + 35) * mapScale;
      mapCtx.fillStyle = '#0984e3';
      mapCtx.beginPath();
      mapCtx.arc(px, pz, 4.5, 0, Math.PI * 2);
      mapCtx.fill();

      mapCtx.strokeStyle = '#2d3436';
      mapCtx.lineWidth = 2;
      mapCtx.beginPath();
      mapCtx.moveTo(px, pz);
      mapCtx.lineTo(px - Math.sin(yaw) * 10, pz - Math.cos(yaw) * 10);
      mapCtx.stroke();
    }

    // --- 9. メインループ ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      if (gameActive && myHp > 0) {
        const isHoldingLeft = isMouseDown && (Date.now() - mouseDownTime >= 200);
        isGuarding = (isHoldingLeft || isRightDown) && !isOverheated && myMp > 0;
        myShield.visible = isGuarding;

        if (isGuarding) {
          myMp = Math.max(0, myMp - 15 * delta);
          if (myMp <= 0.01) { myMp = 0; triggerOverheat(); }
        } else {
          myMp = Math.min(100, myMp + 10 * delta);
          if (isOverheated && myMp >= 100) {
            isOverheated = false;
            document.getElementById('mp-bar').classList.remove('overheat');
            document.getElementById('mp-label').innerText = 'MP (MANA)';
            document.getElementById('mp-label').style.color = '#2d3436';
          }
        }
        document.getElementById('mp-bar').style.width = `${myMp}%`;

        camera.rotation.order = 'YXZ';
        let shakeX = 0, shakeY = 0;
        if (shakeIntensity > 0) {
          shakeX = (Math.random() - 0.5) * shakeIntensity;
          shakeY = (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity -= delta * 1.2;
        }
        camera.rotation.y = yaw + shakeX;
        camera.rotation.x = pitch + shakeY;

        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const moveVec = new THREE.Vector3();

        if (keys['KeyW']) moveVec.add(forward);
        if (keys['KeyS']) moveVec.sub(forward);
        if (keys['KeyD']) moveVec.add(right);
        if (keys['KeyA']) moveVec.sub(right);

        if (moveVec.lengthSq() > 0) {
          moveVec.normalize();
          const speed = isGuarding ? 5.5 : 11;
          const targetX = camera.position.x + moveVec.x * speed * delta;
          const targetZ = camera.position.z + moveVec.z * speed * delta;
          const resolved = resolveCollision(targetX, targetZ);
          camera.position.x = resolved.x;
          camera.position.z = resolved.z;
        }

        velocityY += gravity * delta;
        camera.position.y += velocityY * delta;

        if (camera.position.y >= 13.6) {
          camera.position.y = 13.6;
          if (velocityY > 0) velocityY = 0;
        }

        const targetFloorY = checkGround(camera.position.y);
        if (camera.position.y <= targetFloorY) {
          camera.position.y = targetFloorY;
          velocityY = 0;
          isGrounded = true;
        } else {
          isGrounded = false;
        }

        if (conn && conn.open) {
          conn.send({
            type: 'move',
            x: camera.position.x,
            y: camera.position.y,
            z: camera.position.z,
            rot: yaw,
            isGuarding
          });
        }

        updateCompass();
        renderMinimap();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= delta;
        p.v.y += gravity * 0.6 * delta;
        p.mesh.position.addScaledVector(p.v, delta);
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      const spellSphere = new THREE.Sphere(new THREE.Vector3(), 0.35);
      for (let i = spells.length - 1; i >= 0; i--) {
        const s = spells[i];
        s.life -= delta;
        s.group.position.x += s.vx * delta;
        s.group.position.y += s.vy * delta;
        s.group.position.z += s.vz * delta;
        spellSphere.center.copy(s.group.position);

        let collided = false;

        for (let box of colliders) {
          if (box.intersectsSphere(spellSphere)) { collided = true; break; }
        }
        if (s.group.position.y <= 0.2 || s.group.position.y >= 13.8) collided = true;

        if (s.isMine && enemyMesh.visible) {
          const enemyCenter = enemyMesh.position.clone().add(new THREE.Vector3(0, 0.9, 0));
          if (s.group.position.distanceTo(enemyCenter) < 1.25) {
            collided = true;
          }
        }

        if (!s.isMine && myHp > 0) {
          if (camera.position.distanceTo(s.group.position) < 1.3) {
            collided = true;
            let damage = 25;

            if (isGuarding) {
              const camDir = new THREE.Vector3();
              camera.getWorldDirection(camDir);
              const bDir = new THREE.Vector3(s.vx, 0, s.vz).normalize();
              if (camDir.dot(bDir) < -0.3) {
                damage = 6;
                myMp = Math.max(0, myMp - 30);
                if (myMp <= 0.01) { myMp = 0; triggerOverheat(); }
                createExplosion(myShield.getWorldPosition(new THREE.Vector3()), 0x00cec9);
              }
            }

            myHp -= damage;
            triggerHitEffect();
            document.getElementById('hp-bar').style.width = `${Math.max(0, myHp)}%`;

            if (myHp <= 0) {
              document.getElementById('info').innerText = '撃破されました！リスポーン中...';
              if (conn && conn.open) conn.send({ type: 'enemyKilled' });
              setTimeout(() => { resetSpawn(); }, 3000);
            }
          }
        }

        if (collided || s.life <= 0) {
          createExplosion(s.group.position, s.color);
          scene.remove(s.group);
          spells.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
